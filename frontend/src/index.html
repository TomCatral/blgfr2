<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BLGF DTS</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3f3f46" />
    <meta name="description" content="BLGF Region II Document Tracking System" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BLGF DTS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/blgflogo.jpg" />
    <link rel="apple-touch-icon" href="/blgflogo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('blgf_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="blgf-ionic-app">
    <app-root></app-root>
  </body>
</html>
