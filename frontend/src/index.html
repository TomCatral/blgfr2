<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BLGF DTS</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3f3f46" />
    <meta name="description" content="BLGF Region II Document Tracking System" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BLGF DTS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" href="/blgflogo.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('blgf_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();

      window.__blgfInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__blgfInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('blgf-pwa-installable'));
      });
      window.addEventListener('appinstalled', function () {
        window.__blgfInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('blgf-pwa-installed'));
      });
      if (
        'serviceWorker' in navigator &&
        (window.isSecureContext || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/service-worker.js', { scope: '/', updateViaCache: 'none' })
            .then(function (registration) {
              registration.update().catch(function () {});
              if (registration.waiting) {
                registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
              registration.addEventListener('updatefound', function () {
                var worker = registration.installing;
                if (!worker) return;
                worker.addEventListener('statechange', function () {
                  if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                    worker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });
            })
            .catch(function (err) {
              console.warn('BLGF DTS ServiceWorker registration error:', err);
            });
        });

        var refreshingForUpdate = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (refreshingForUpdate || sessionStorage.getItem('blgf_sw_refreshed_v13') === '1') return;
          refreshingForUpdate = true;
          sessionStorage.setItem('blgf_sw_refreshed_v13', '1');
          window.location.reload();
        });
      }
    </script>
  </head>
  <body class="blgf-ionic-app">
    <app-root></app-root>
  </body>
</html>
