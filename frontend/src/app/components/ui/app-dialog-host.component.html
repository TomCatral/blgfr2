
    @if (request) {
      <div class="_overlay_ _backdrop_ dialogDismiss" (click)="dismiss()">
        <div class="_dialog_ dialogStop" (click)="stop($event)">
          <div class="dialogStyle">
            <div
              class="dialog-symbol"
              [class.dialog-symbol-confirm]="request.kind === 'confirm'"
              [class.dialog-symbol-prompt]="request.kind !== 'confirm'"
            >
              <ion-icon
                [name]="request.kind === 'confirm' ? 'alert-circle' : 'create'"
                class="dialogIcon"
              ></ion-icon>
            </div>
          </div>
          <div class="dialog2">{{ request.message }}</div>
          @if (request.kind === 'prompt') {
            <input
              #promptInput
              [(ngModel)]="promptValue"
              placeholder="{{ request.defaultValue }}"
              (keydown.enter)="accept()"
              class="dialogRequestDefaultValueInput"
            />
          }
          <div class="dialog3">
            <button class="_cancelButton_ dialogDismissBtn" (click)="dismiss()">
              {{ request.kind === 'confirm' ? 'Cancel' : 'Dismiss' }}
            </button>
            <button class="_primaryButton_ dialogAcceptBtn" (click)="accept()">
              {{ request.kind === 'confirm' ? 'Confirm' : 'OK' }}
            </button>
          </div>
        </div>
      </div>
    }

    @if (ui.successAlert(); as message) {
      <div class="_panel_ dialog4">
        <div class="dialog5">
          <ion-icon name="checkmark-circle" class="dialogCheckmarkCircleIcon"></ion-icon>
          <div class="dialog6">{{ message }}</div>
          <button class="dialogClearSuccessBtn" (click)="ui.clearSuccess()">
            <ion-icon name="close" class="dialogCloseIcon"></ion-icon>
          </button>
        </div>
      </div>
    }

    @if (ui.errorAlert(); as message) {
      <div class="_panel_ dialog7">
        <div class="dialog5">
          <ion-icon name="alert-circle" class="dialogAlertCircleIcon"></ion-icon>
          <div class="dialog6">{{ message }}</div>
          <button class="dialogClearSuccessBtn" (click)="ui.clearError()">
            <ion-icon name="close" class="dialogCloseIcon"></ion-icon>
          </button>
        </div>
      </div>
    }
