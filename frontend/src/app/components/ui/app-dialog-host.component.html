
    @if (request) {
      <div class="fixed inset-0 z-[400] flex items-center justify-center bg-slate-950/60 p-4 backdrop-blur-sm _overlay_ _backdrop_" (click)="dismiss()">
        <div class="w-full max-w-md rounded-3xl border border-[color:var(--ui-border)] bg-[color:var(--ui-surface)] p-6 shadow-2xl _dialog_" (click)="stop($event)">
          <div class="mb-4 flex justify-center">
            <div class="flex h-12 w-12 items-center justify-center rounded-2xl {{ request.kind === 'confirm' ? 'bg-rose-500/15 text-rose-600 dark:bg-rose-500/20 dark:text-rose-400' : 'bg-blue-500/15 text-blue-600 dark:bg-blue-500/20 dark:text-blue-400' }}">
              <ion-icon
                [name]="request.kind === 'confirm' ? 'alert-circle' : 'create'"
                class="text-3xl"
              ></ion-icon>
            </div>
          </div>
          <div class="whitespace-pre-wrap text-center text-[14.5px] font-semibold leading-relaxed text-[color:var(--ui-text)]">{{ request.message }}</div>
          @if (request.kind === 'prompt') {
            <input
              #promptInput
              [(ngModel)]="promptValue"
              placeholder="{{ request.defaultValue }}"
              (keydown.enter)="accept()"
              class="mt-4 w-full rounded-xl border border-[color:var(--ui-border)] bg-[color:var(--ui-soft)] px-3.5 py-2.5 text-sm outline-none transition-all focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15"
            />
          }
          <div class="mt-6 flex justify-end gap-2.5">
            <button class="_cancelButton_ rounded-xl border border-[color:var(--ui-border)] bg-[color:var(--ui-surface)] px-4 py-2 text-xs font-bold text-[color:var(--ui-text)] transition-colors hover:bg-[color:var(--ui-soft)] cursor-pointer" (click)="dismiss()">
              {{ request.kind === 'confirm' ? 'Cancel' : 'Dismiss' }}
            </button>
            <button class="_primaryButton_ rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 px-5 py-2 text-xs font-bold text-white shadow-sm shadow-blue-600/25 transition-all hover:from-blue-500 hover:to-indigo-500 hover:-translate-y-0.5 active:scale-95 cursor-pointer" (click)="accept()">
              {{ request.kind === 'confirm' ? 'Confirm' : 'OK' }}
            </button>
          </div>
        </div>
      </div>
    }

    @if (ui.successAlert(); as message) {
      <div class="fixed right-5 top-5 z-[500] max-w-sm rounded-2xl border border-emerald-500/30 bg-white/95 backdrop-blur-xl px-4 py-3.5 text-xs font-semibold text-emerald-950 shadow-2xl _panel_ dark:border-emerald-500/30 dark:bg-slate-900/95 dark:text-emerald-200 transition-all">
        <div class="flex items-start gap-2.5">
          <ion-icon name="checkmark-circle" class="text-xl text-emerald-500 mt-0.5 shrink-0"></ion-icon>
          <div class="whitespace-pre-wrap flex-1 leading-relaxed">{{ message }}</div>
          <button class="ml-1 p-0.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors" (click)="ui.clearSuccess()">
            <ion-icon name="close" class="text-base"></ion-icon>
          </button>
        </div>
      </div>
    }

    @if (ui.errorAlert(); as message) {
      <div class="fixed right-5 top-5 z-[500] max-w-sm rounded-2xl border border-rose-500/30 bg-white/95 backdrop-blur-xl px-4 py-3.5 text-xs font-semibold text-rose-950 shadow-2xl _panel_ dark:border-rose-500/30 dark:bg-slate-900/95 dark:text-rose-200 transition-all">
        <div class="flex items-start gap-2.5">
          <ion-icon name="alert-circle" class="text-xl text-rose-500 mt-0.5 shrink-0"></ion-icon>
          <div class="whitespace-pre-wrap flex-1 leading-relaxed">{{ message }}</div>
          <button class="ml-1 p-0.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors" (click)="ui.clearError()">
            <ion-icon name="close" class="text-base"></ion-icon>
          </button>
        </div>
      </div>
    }
