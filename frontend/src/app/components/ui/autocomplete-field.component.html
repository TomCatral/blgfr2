
    <div class="autocomplete-container">
      @if (multiline) {
        <textarea
          [ngModel]="value"
          (ngModelChange)="onChange.emit($event)"
          [placeholder]="placeholder || ''"
          [required]="required"
          [rows]="rows || 2"
          [attr.aria-label]="ariaLabel || placeholder"
          (focus)="focused = true"
          (blur)="hideAfterDelay()"
          [ngClass]="inputClass"
          class="autocomplete-input"
        ></textarea>
      } @else {
        <input
          [ngModel]="value"
          (ngModelChange)="onChange.emit($event)"
          [placeholder]="placeholder || ''"
          [required]="required"
          [attr.aria-label]="ariaLabel || placeholder"
          (focus)="focused = true"
          (blur)="hideAfterDelay()"
          [ngClass]="inputClass"
          class="autocomplete-input"
        />
      }
      @if (focused && suggestions.length && value.trim()) {
        <div class="autocomplete-dropdown">
          @for (suggestion of filteredSuggestions; track suggestion; let i = $index) {
            <button
              type="button"
              class="autocomplete-option"
              (mousedown)="select($event, suggestion)"
            >
              {{ suggestion }}
            </button>
          }
        </div>
      }
    </div>
