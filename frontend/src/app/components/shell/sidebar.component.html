
    <aside class="blgf-sidebar sidebar-style-001-735468" aria-label="Primary navigation">
      <div class="sidebar-style-002-cfec61" [class.justify-center]="collapsed" [class.justify-between]="!collapsed">
        @if (!collapsed) {
          <div class="sidebar-style-003-a089bf">
            <span class="sidebar-style-004-322256"></span>
            <span class="sidebar-style-005-3d0338">Navigation</span>
          </div>
        }
        @if (innerWidth >= 768) {
          <button
            type="button"
            class="sidebar-style-006-84e6a7"
            [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
            (click)="onToggleCollapse.emit()"
          >
            <ion-icon [name]="collapsed ? 'chevron-forward' : 'chevron-back'"></ion-icon>
          </button>
        } @else {
          <button
            type="button"
            class="sidebar-style-007-5b6309"
            [attr.aria-label]="'Close navigation menu'"
            (click)="onCloseMobile.emit()"
          >
            <ion-icon name="close"></ion-icon>
          </button>
        }
      </div>
      <div class="sidebar-style-008-aa8838"></div>

      <nav class="sidebar-style-009-0142ec">
        @for (section of visibleSections(); track section; let sectionIndex = $index) {
          <section class="sidebar-style-010-1920d1" [ngClass]="sectionIndex === 0 ? '' : 'mt-2'" [attr.aria-label]="section">
            @if (!collapsed) {
              <p class="sidebar-style-011-30b16e">{{ section }}</p>
            }
            <div class="sidebar-style-012-1aa233">
              @for (item of itemsFor(section); track item.id) {
                <button
                  type="button"
                  class="blgf-sidebar-item"
                  [class.is-active]="displayedView === item.id"
                  [class.is-collapsed]="collapsed"
                  [class.justify-center]="collapsed"
                  [class.justify-start]="!collapsed"
                  [class.px-1]="collapsed"
                  [class.px-2.5]="!collapsed"
                  [attr.aria-current]="displayedView === item.id ? 'page' : null"
                  [attr.aria-label]="item.label"
                  [attr.title]="item.label + (item.showsPendingCount && pendingCount > 0 ? ' (' + pendingCount + ' pending)' : '')"
                  (click)="handleNavigate(item.id)"
                >
                  <span class="blgf-sidebar-icon">
                    <ion-icon name="{{ item.icon }}"></ion-icon>
                  </span>
                  @if (!collapsed) {
                    <span class="blgf-sidebar-label sidebar-style-013-de6921">{{ item.label }}</span>
                  } @else {
                    <span class="blgf-sidebar-tooltip">{{ item.label }}</span>
                  }
                  @if (!collapsed && item.showsPendingCount && pendingCount > 0) {
                    <span class="sidebar-style-014-806a12">
                      {{ pendingCount > 99 ? '99+' : pendingCount }}
                    </span>
                  }
                  @if (collapsed && item.showsPendingCount && pendingCount > 0) {
                    <span class="blgf-collapsed-badge">
                      {{ pendingCount > 99 ? '99+' : pendingCount }}
                    </span>
                  }
                </button>
              }
            </div>
          </section>
        }
      </nav>

      <div class="sidebar-style-008-aa8838"></div>

      <button
        type="button"
        class="blgf-sidebar-footer"
        [class.is-collapsed]="collapsed"
        [class.justify-center]="collapsed"
        [attr.aria-label]="'Account Settings: ' + currentUser.fullName"
        [attr.title]="'Account Settings: ' + currentUser.fullName"
        (click)="handleNavigate('settings')"
      >
        <div class="sidebar-style-015-2a3565">
          @if (currentUser.avatarUrl) {
            <img [src]="currentUser.avatarUrl" [alt]="currentUser.fullName + ' profile'" class="sidebar-style-016-aa4b87" />
          } @else {
            {{ currentUser.fullName.charAt(0) || 'U' }}
          }
        </div>
        @if (!collapsed) {
          <div class="sidebar-style-017-b3836b">
            <p class="sidebar-style-018-d451d3">{{ currentUser.fullName }}</p>
            <p class="sidebar-style-019-b1d423">{{ currentUser.designation || currentUser.role.replaceAll('_', ' ') }}</p>
          </div>
          <ion-icon name="settings-outline" class="sidebar-style-020-02ca88"></ion-icon>
        } @else {
          <span class="blgf-sidebar-mini-label">Settings</span>
        }
      </button>
    </aside>
