
    <aside class="blgf-sidebar h-full" aria-label="Primary navigation">
      <div class="flex min-h-13 shrink-0 items-center px-3 py-2" [class.justify-center]="collapsed" [class.justify-between]="!collapsed">
        @if (!collapsed) {
          <div class="flex items-center gap-2">
            <span class="h-2 w-2 rounded-full bg-blue-600"></span>
            <span class="text-[11px] font-extrabold uppercase tracking-[0.14em] text-slate-400 dark:text-slate-500">Navigation</span>
          </div>
        }
        @if (innerWidth >= 768) {
          <button
            type="button"
            class="flex h-8 w-8 items-center justify-center rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 dark:hover:text-slate-200 transition-colors"
            [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
            (click)="onToggleCollapse.emit()"
          >
            <ion-icon [name]="collapsed ? 'chevron-forward' : 'chevron-back'"></ion-icon>
          </button>
        } @else {
          <button
            type="button"
            class="ml-auto flex h-8 w-8 items-center justify-center rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 dark:hover:text-slate-200 transition-colors"
            [attr.aria-label]="'Close navigation menu'"
            (click)="onCloseMobile.emit()"
          >
            <ion-icon name="close"></ion-icon>
          </button>
        }
      </div>
      <div class="h-px shrink-0 w-full bg-slate-200/80 dark:bg-slate-800/80"></div>

      <nav class="min-h-0 flex-1 overflow-y-auto px-2 py-3">
        @for (section of visibleSections(); track section; let sectionIndex = $index) {
          <section class="mb-3" [ngClass]="sectionIndex === 0 ? '' : 'mt-2'" [attr.aria-label]="section">
            @if (!collapsed) {
              <p class="block px-2.5 py-1 text-[10px] font-extrabold uppercase tracking-[0.14em] text-slate-400 dark:text-slate-500">{{ section }}</p>
            }
            <div class="space-y-0.5">
              @for (item of itemsFor(section); track item.id) {
                <button
                  type="button"
                  class="blgf-sidebar-item"
                  [class.is-active]="displayedView === item.id"
                  [class.is-collapsed]="collapsed"
                  [class.justify-center]="collapsed"
                  [class.justify-start]="!collapsed"
                  [class.px-1]="collapsed"
                  [class.px-2.5]="!collapsed"
                  [attr.aria-current]="displayedView === item.id ? 'page' : null"
                  [attr.aria-label]="item.label"
                  [attr.title]="item.label + (item.showsPendingCount && pendingCount > 0 ? ' (' + pendingCount + ' pending)' : '')"
                  (click)="handleNavigate(item.id)"
                >
                  <span class="blgf-sidebar-icon">
                    <ion-icon name="{{ item.icon }}"></ion-icon>
                  </span>
                  @if (!collapsed) {
                    <span class="blgf-sidebar-label min-w-0 flex-1 truncate text-left">{{ item.label }}</span>
                  } @else {
                    <span class="blgf-sidebar-mini-label">{{ item.miniLabel || item.label }}</span>
                  }
                  @if (!collapsed && item.showsPendingCount && pendingCount > 0) {
                    <span class="ml-auto inline-flex h-5 min-w-5 items-center justify-center rounded-full px-1.5 text-[9.5px] font-extrabold bg-amber-500/15 text-amber-700 dark:text-amber-300 border border-amber-500/30">
                      {{ pendingCount > 99 ? '99+' : pendingCount }}
                    </span>
                  }
                  @if (collapsed && item.showsPendingCount && pendingCount > 0) {
                    <span class="blgf-collapsed-badge">
                      {{ pendingCount > 99 ? '99+' : pendingCount }}
                    </span>
                  }
                </button>
              }
            </div>
          </section>
        }
      </nav>

      <div class="h-px shrink-0 w-full bg-slate-200/80 dark:bg-slate-800/80"></div>

      <button
        type="button"
        class="blgf-sidebar-footer"
        [class.is-collapsed]="collapsed"
        [class.justify-center]="collapsed"
        [attr.aria-label]="'Account Settings: ' + currentUser.fullName"
        [attr.title]="'Account Settings: ' + currentUser.fullName"
        (click)="handleNavigate('settings')"
      >
        <div class="relative flex h-8 w-8 shrink-0 items-center justify-center overflow-hidden rounded-full text-xs font-extrabold text-white shadow-sm bg-gradient-to-br from-blue-600 to-indigo-600 ring-2 ring-white dark:ring-slate-800">
          @if (currentUser.avatarUrl) {
            <img [src]="currentUser.avatarUrl" [alt]="currentUser.fullName + ' profile'" class="h-full w-full object-cover" />
          } @else {
            {{ currentUser.fullName.charAt(0) || 'U' }}
          }
        </div>
        @if (!collapsed) {
          <div class="min-w-0 ml-2 text-left flex-1">
            <p class="truncate text-xs font-bold text-slate-800 dark:text-slate-200">{{ currentUser.fullName }}</p>
            <p class="truncate text-[10.5px] text-slate-400 dark:text-slate-500">{{ currentUser.designation || currentUser.role.replaceAll('_', ' ') }}</p>
          </div>
          <ion-icon name="settings-outline" class="text-sm text-slate-400 ml-auto"></ion-icon>
        } @else {
          <span class="blgf-sidebar-mini-label">Settings</span>
        }
      </button>
    </aside>
