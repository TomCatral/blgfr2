
    <aside class="blgf-sidebar" aria-label="Primary navigation">
      <div class="sidebar-header" [class.is-collapsed]="collapsed">
        @if (!collapsed) {
          <div class="sidebar-heading">
            <span class="sidebar-heading-dot"></span>
            <span class="sidebar-heading-label">Navigation</span>
          </div>
        }
        @if (innerWidth >= 768) {
          <button
            type="button"
            class="sidebar-header-button"
            [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
            (click)="onToggleCollapse.emit()"
          >
            <ion-icon [name]="collapsed ? 'chevron-forward' : 'chevron-back'"></ion-icon>
          </button>
        } @else {
          <button
            type="button"
            class="sidebar-header-button sidebar-mobile-close"
            [attr.aria-label]="'Close navigation menu'"
            (click)="onCloseMobile.emit()"
          >
            <ion-icon name="close"></ion-icon>
          </button>
        }
      </div>
      <div class="sidebar-divider"></div>

      <nav class="sidebar-navigation" [class.is-collapsed]="collapsed">
        @for (section of visibleSections(); track section; let sectionIndex = $index) {
          <section class="sidebar-section" [class.has-spacing]="sectionIndex !== 0" [attr.aria-label]="section">
            @if (!collapsed) {
              <p class="sidebar-section-label">{{ section }}</p>
            }
            <div class="sidebar-section-items">
              @for (item of itemsFor(section); track item.id) {
                <button
                  type="button"
                  class="blgf-sidebar-item"
                  [class.is-active]="displayedView === item.id"
                  [class.is-collapsed]="collapsed"
                  [attr.aria-current]="displayedView === item.id ? 'page' : null"
                  [attr.aria-label]="item.label"
                  [attr.title]="collapsed ? null : item.label + (item.showsPendingCount && pendingCount > 0 ? ' (' + pendingCount + ' pending)' : '')"
                  (click)="handleNavigate(item.id)"
                >
                  <span class="blgf-sidebar-icon">
                    <ion-icon name="{{ item.icon }}"></ion-icon>
                  </span>
                  @if (!collapsed) {
                    <span class="blgf-sidebar-label">{{ item.label }}</span>
                  } @else {
                    <span class="blgf-sidebar-tooltip">{{ item.label }}</span>
                  }
                  @if (!collapsed && item.showsPendingCount && pendingCount > 0) {
                    <span class="sidebar-pending-badge">
                      {{ pendingCount > 99 ? '99+' : pendingCount }}
                    </span>
                  }
                  @if (collapsed && item.showsPendingCount && pendingCount > 0) {
                    <span class="blgf-collapsed-badge">
                      {{ pendingCount > 99 ? '99+' : pendingCount }}
                    </span>
                  }
                </button>
              }
            </div>
          </section>
        }
      </nav>

      <div class="sidebar-divider"></div>

      <button
        type="button"
        class="blgf-sidebar-footer"
        [class.is-collapsed]="collapsed"
        [attr.aria-label]="'Account Settings: ' + currentUser.fullName"
        [attr.title]="collapsed ? null : 'Account Settings: ' + currentUser.fullName"
        (click)="handleNavigate('settings')"
      >
        <div class="sidebar-avatar">
          @if (currentUser.avatarUrl) {
            <img [src]="currentUser.avatarUrl" [alt]="currentUser.fullName + ' profile'" class="sidebar-avatar-image" />
          } @else {
            {{ currentUser.fullName.charAt(0) || 'U' }}
          }
        </div>
        @if (!collapsed) {
          <div class="sidebar-account-copy">
            <p class="sidebar-account-name">{{ currentUser.fullName }}</p>
            <p class="sidebar-account-role">{{ currentUser.designation || currentUser.role.replaceAll('_', ' ') }}</p>
          </div>
          <ion-icon name="settings-outline" class="sidebar-settings-icon"></ion-icon>
        } @else {
          <span class="blgf-sidebar-tooltip">Account Settings</span>
        }
      </button>
    </aside>
